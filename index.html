.main{position:relative;gap:0}

<body>
<div class="app">
  <header class="header">
    <div class="brand"><div class="brand-icon" aria-hidden="true">∧</div><div><h1>Mantık Laboratuvarı</h1></div></div>
    <div class="header-actions">
      <button id="demoBtn" class="action primary" title="Örnek yarım toplayıcı devresi kur">◈ Örnek devre</button>
      <button id="undoBtn" class="action icon-action" aria-label="Geri al" title="Geri al (Ctrl+Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button>
      <button id="redoBtn" class="action icon-action" aria-label="İleri al" title="İleri al (Ctrl+Y)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h2"/></svg></button>
      <button id="newBtn" class="action icon-action" aria-label="Temizle" title="Çalışma alanını temizle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7"/><path d="M3 4v7h7"/></svg></button>
    </div>
  </header>
  <div class="workspace-layout">
    <aside class="sidebar" aria-label="Araç kutusu">
      <h2>ARAÇ KUTUSU</h2>

<script>
(()=>{'use strict';

const $=id=>document.getElementById(id);

function nextName(type){const n=nodes.filter(x=>x.type===type).length+1;return type==='switch'?String.fromCharCode(65+((n-1)%26)):type==='lamp'?'Lamba '+n:TYPE_NAMES[type]+' '+n;}

function centerAdd(type){const r=viewport.getBoundingClientRect(),i=nodes.length,col=i%2,row=Math.floor(i/2),gapX=clamp(r.width/zoom*.50,NW+40,280),gapY=135,cx=(r.width*.5-panX)/zoom,cy=(r.height*.42-panY)/zoom;addNode(type,cx+(col?gapX/2:-gapX/2)-NW/2,cy+row*gapY-NH/2);}
function deleteSelected(){if(!selection){notify('Silmek için önce bir parça veya kablo seç.');return;}remember();if(selection.kind==='node'){const id=selection.id;nodes=nodes.filter(n=>n.id!==id);edges=edges.filter(e=>e.from!==id&&e.to!==id);}else{edges=edges.filter(e=>e.id!==selection.id);}selection=null;pending=null;refresh();persist();notify('Seçim silindi.');}
function clearBoard(){if(!nodes.length)return;if(!confirm('Tüm parçalar ve kablolar silinsin mi?'))return;remember();nodes=[];edges=[];selection=null;pending=null;refresh();persist();}
function getNode(id){return nodes.find(n=>n.id===id);}
function portPos(node,dir,port=0){const inputs=INPUTS[node.type];return{x:node.x+(dir==='out'?103:43),y:node.y+(dir==='out'||inputs===1?47:port===0?26:68)};}
function pathD(a,b){const dx=b.x-a.x;const bend=clamp(Math.abs(dx)*.47,58,150);return`M ${a.x} ${a.y} C ${a.x+bend} ${a.y}, ${b.x-bend} ${b.y}, ${b.x} ${b.y}`;}
function svgEl(tag,attrs){const e=document.createElementNS(svgNS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));return e;}
function makesCycle(source,target){const seen=new Set(),todo=[target];while(todo.length){const n=todo.pop();if(n===source)return true;if(seen.has(n))continue;seen.add(n);for(const e of edges)if(e.from===n)todo.push(e.to);}return false;}
function attach(a,b){if(!a||!b||a.dir===b.dir){notify('Bir çıkışı bir girişe bağlamalısın.');return;}const out=a.dir==='out'?a:b,inn=a.dir==='in'?a:b;
 const src=getNode(out.nodeId),dst=getNode(inn.nodeId);if(!src||!dst||INPUTS[dst.type]<=inn.port)return;
 if(src.id===dst.id||makesCycle(src.id,dst.id)){notify('Döngü oluşturan kabloya izin verilmiyor.');return;}
 if(edges.some(e=>e.from===src.id&&e.to===dst.id&&e.port===inn.port)){pending=null;renderPorts();notify('Bu kablo zaten bağlı.');return;}
 remember();edges=edges.filter(e=>!(e.to===dst.id&&e.port===inn.port));edges.push({id:nextId++,from:src.id,to:dst.id,port:inn.port});pending=null;selection=null;refresh();persist();notify(src.name+' → '+dst.name+' bağlandı');}
function handlePortTap(p){if(!pending){pending=p;renderPorts();return;}if(pending.nodeId===p.nodeId&&pending.dir===p.dir&&pending.port===p.port){pending=null;renderPorts();return;}if(pending.dir===p.dir){pending=p;renderPorts();notify('Karşı yöndeki bir ucu seç.');return;}attach(pending,p);}
function gateSvg(type){const attrs='fill="#fff" stroke="#4d4145" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"';let path='';
 if(type==='and')path=`<path d="M20 11H42C80 11 80 57 42 57H20Z" ${attrs}/>`;
 if(type==='or')path=`<path d="M15 11Q34 34 15 57Q52 57 75 34Q52 11 15 11Z" ${attrs}/>`;
 if(type==='xor')path=`<path d="M10 11Q29 34 10 57" fill="none" stroke="#4d4145" stroke-width="3.2"/><path d="M18 11Q37 34 18 57Q52 57 75 34Q52 11 18 11Z" ${attrs}/>`;
 if(type==='not')path=`<path d="M18 11L69 34 18 57Z" ${attrs}/><circle cx="75" cy="34" r="5" ${attrs}/>`;
 return `<svg viewBox="0 0 94 69" aria-hidden="true">${path}</svg>`;}
function compute(){const values={};const visiting=new Set();const outOf=id=>{if(Object.prototype.hasOwnProperty.call(values,id))return values[id].output;const n=getNode(id);if(!n)return null;if(visiting.has(id))return null;visiting.add(id);let inputs=[];for(let i=0;i<INPUTS[n.type];i++){const edge=edges.find(e=>e.to===id&&e.port===i);inputs.push(edge?outOf(edge.from):null);}let output=null;
 switch(n.type){case 'switch':output=n.value?1:0;break;case 'lamp':output=null;break;case 'not':if(inputs[0]!==null)output=inputs[0]===1?0:1;break;case 'and':if(inputs.every(v=>v!==null))output=inputs[0]&inputs[1];break;case 'or':if(inputs.every(v=>v!==null))output=inputs[0]|inputs[1];break;case 'xor':if(inputs.every(v=>v!==null))output=inputs[0]^inputs[1];break;}
 values[id]={inputs,output,lit:n.type==='lamp'?inputs[0]:null};visiting.delete(id);return output;};
 for(const n of nodes)outOf(n.id);computed=values;}
function outputValue(id){return computed[id]?.output??null;}
function valueClass(v){return v===1?'on':v===0?'off':'unknown';}
function renderWires(){wiresEl.replaceChildren();for(const edge of edges){const src=getNode(edge.from),dst=getNode(edge.to);if(!src||!dst)continue;const d=pathD(portPos(src,'out'),portPos(dst,'in',edge.port)),group=svgEl('g',{'class':'wire'+(selection?.kind==='wire'&&selection.id===edge.id?' wire-selected':'')});group.appendChild(svgEl('path',{d,'class':'wire-bg'}));group.appendChild(svgEl('path',{d,'class':'wire-signal '+valueClass(outputValue(src.id))}));if(outputValue(src.id)===1)group.appendChild(svgEl('path',{d,'class':'wire-flow'}));const hit=svgEl('path',{d,'class':'wire-hit'});hit.addEventListener('pointerdown',e=>e.stopPropagation());hit.addEventListener('click',e=>{e.stopPropagation();selection={kind:'wire',id:edge.id};refresh();});group.appendChild(hit);wiresEl.appendChild(group);}if(draggingWire?.moved&&wirePreview){const f=draggingWire.start,origin=getNode(f.nodeId);if(origin){const p=portPos(origin,f.dir,f.port),d=pathD(f.dir==='out'?p:wirePreview,f.dir==='out'?wirePreview:p);wiresEl.appendChild(svgEl('path',{d,stroke:'#548fbf','stroke-width':3,'stroke-dasharray':'7 5',fill:'none','pointer-events':'none'}));}}}
function decorateNode(n){const el=document.createElement('div');el.className='node'+(selection?.kind==='node'&&selection.id===n.id?' selected':'');el.dataset.id=n.id;el.style.left=n.x+'px';el.style.top=n.y+'px';
 const title=document.createElement('span');title.className='node-name';title.textContent=n.name;el.appendChild(title);
 const shape=document.createElement('div');shape.className='node-shape';if(n.type==='switch'){const b=document.createElement('button');b.className='switch-toggle'+(n.value?' active':'');b.textContent=n.value?'1':'0';b.setAttribute('aria-label',`${n.name}: ${n.value?'açık':'kapalı'}, değiştirmek için dokun`);b.addEventListener('click',e=>{if(e.detail!==0)return;e.stopPropagation();remember();n.value=n.value?0:1;selection={kind:'node',id:n.id};refresh();persist();});shape.appendChild(b);}
 else if(n.type==='lamp'){let v=computed[n.id]?.lit??null;const bulb=document.createElement('div');bulb.className='lamp-body '+valueClass(v)+(n.emoji?' has-emoji':'');
  if(n.emoji){const face=document.createElement('span');face.className='lamp-face';face.textContent=n.emoji;const bit=document.createElement('span');bit.className='lamp-bit';bit.textContent=v===null?'?':String(v);bulb.append(face,bit);}
  else bulb.textContent=v===null?'?':String(v);
  bulb.setAttribute('aria-label',`Lamba ${v===1?'yanıyor':v===0?'sönük':'bağlı değil'}`);shape.appendChild(bulb);}
 else{shape.innerHTML=gateSvg(n.type);const v=outputValue(n.id);const state=document.createElement('span');state.className='gate-value '+valueClass(v);state.textContent=v===null?'?':String(v);shape.appendChild(state);}el.appendChild(shape);
 const typeEl=document.createElement('span');typeEl.className='node-type';typeEl.textContent=n.type==='switch'?'ANAHTAR':n.type==='lamp'?'LAMBA':n.type.toUpperCase();el.appendChild(typeEl);
 for(let i=0;i<INPUTS[n.type];i++)addPort(el,n,'in',i,computed[n.id]?.inputs?.[i]??null);
 if(n.type!=='lamp')addPort(el,n,'out',0,outputValue(n.id));
 el.addEventListener('pointerdown',e=>{if(e.target.closest('.port'))return;if(e.target.closest('button')&&n.type!=='switch')return;const toggleOnTap=!!e.target.closest('.switch-toggle');e.stopPropagation();e.preventDefault();const startX=e.clientX,startY=e.clientY,oldX=n.x,oldY=n.y;let moved=false;el.setPointerCapture(e.pointerId);
 const move=ev=>{if(ev.pointerId!==e.pointerId)return;const delta=Math.hypot(ev.clientX-startX,ev.clientY-startY);if(!moved&&delta>5){moved=true;remember();}if(!moved)return;n.x=clamp(oldX+(ev.clientX-startX)/zoom,10,W-NW-10);n.y=clamp(oldY+(ev.clientY-startY)/zoom,10,H-NH-10);el.style.left=n.x+'px';el.style.top=n.y+'px';renderWires();};
 const end=ev=>{if(ev.pointerId!==e.pointerId)return;el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);if(moved){persist();refresh();}else{if(toggleOnTap){remember();n.value=n.value?0:1;persist();}selection={kind:'node',id:n.id};refresh();}};

 });return el;}
function addPort(el,n,dir,port,value){const p=document.createElement('button');p.className=`port ${dir} ${dir==='out'||INPUTS[n.type]===1?'pmid':port===0?'p0':'p1'} ${valueClass(value)}`;p.dataset.nodeId=n.id;p.dataset.dir=dir;p.dataset.port=port;let description=dir==='out'?'Çıkış':`Giriş ${port+1}`;p.setAttribute('aria-label',`${n.name} ${description} portu`);p.title=`${n.name} · ${description}`;if(pending?.nodeId===n.id&&pending.dir===dir&&pending.port===port)p.classList.add('pending');
 p.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();const from={nodeId:n.id,dir,port};if(pending){handlePortTap(from);return;}const initialX=e.clientX,initialY=e.clientY;let moved=false;p.setPointerCapture(e.pointerId);draggingWire={start:from,moved:false};const move=ev=>{if(ev.pointerId!==e.pointerId)return;if(!moved&&Math.hypot(ev.clientX-initialX,ev.clientY-initialY)>7)moved=true;if(moved){draggingWire.moved=true;wirePreview=point(ev);renderWires();}};
 const end=ev=>{if(ev.pointerId!==e.pointerId)return;p.removeEventListener('pointermove',move);p.removeEventListener('pointerup',end);p.removeEventListener('pointercancel',end);draggingWire=null;wirePreview=null;renderWires();if(!moved){handlePortTap(from);return;}
 const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.port');if(target){const to={nodeId:Number(target.dataset.nodeId),dir:target.dataset.dir,port:Number(target.dataset.port)};attach(from,to);}else{pending=from;renderPorts();}};

 });el.appendChild(p);}
function renderPorts(){for(const p of nodesEl.querySelectorAll('.port')){const active=pending&&Number(p.dataset.nodeId)===pending.nodeId&&p.dataset.dir===pending.dir&&Number(p.dataset.port)===pending.port;p.classList.toggle('pending',!!active);}}
// Pure evaluation for each truth-table row; live switch state is never changed.
function evaluateCircuit(switchStates){
 const memo=new Map(),inProgress=new Set();
 function evalNode(id){
  if(memo.has(id))return memo.get(id);const n=getNode(id);if(!n||inProgress.has(id))return null;
  inProgress.add(id);let result=null;
  if(n.type==='switch')result=switchStates.has(n.id)?switchStates.get(n.id):(n.value?1:0);
  else{const inputs=Array.from({length:INPUTS[n.type]},(_,i)=>{const edge=edges.find(e=>e.to===id&&e.port===i);return edge?evalNode(edge.from):null;});
   if(n.type==='lamp')result=inputs[0];
   else if(n.type==='not'&&inputs[0]!=null)result=inputs[0]?0:1;
   else if(inputs.length===2&&inputs.every(v=>v!==null)){
    if(n.type==='and')result=inputs[0]&inputs[1];
    if(n.type==='or')result=inputs[0]|inputs[1];
    if(n.type==='xor')result=inputs[0]^inputs[1];
   }
  }
  inProgress.delete(id);memo.set(id,result);return result;
 }

}
function lampExpression(lamp){

 function expression(id){const n=getNode(id);if(!n||stack.has(id))return null;
  if(n.type==='switch')return {text:n.name,compound:false};
  stack.add(id);
  const parts=[];for(let i=0;i<INPUTS[n.type];i++){
   const e=edges.find(x=>x.to===id&&x.port===i);if(!e){stack.delete(id);return null;}
   const part=expression(e.from);if(!part){stack.delete(id);return null;}parts.push(part);
  }
  stack.delete(id);
  if(n.type==='lamp')return parts[0];
  if(n.type==='not')return {text:'NOT '+(parts[0].compound?'('+parts[0].text+')':parts[0].text),compound:true};
  const op=n.type.toUpperCase();return {text:parts.map(p=>p.compound?'('+p.text+')':p.text).join(' '+op+' '),compound:true};
 }

}
function renderTruth(){
 const switches=nodes.filter(n=>n.type==='switch'),lamps=nodes.filter(n=>n.type==='lamp');
 const table=$('truthTable');table.replaceChildren();
 const rows=switches.length?Math.pow(2,Math.min(switches.length,6)):0;
 if(switches.length>6||!switches.length){const tr=document.createElement('tr');const td=document.createElement('td');td.className='truth-empty';td.textContent=switches.length>6?'En fazla 6 anahtar':'Anahtar ekle';tr.appendChild(td);table.appendChild(tr);}
 else{
  const thead=document.createElement('thead'),head=document.createElement('tr');
  for(const n of [...switches,...lamps]){const th=document.createElement('th');th.textContent=n.name;th.className=n.type==='lamp'?'out':'';head.appendChild(th);}
  thead.appendChild(head);table.appendChild(thead);
  const tbody=document.createElement('tbody');
  for(let r=0;r<rows;r++){
   const states=new Map(switches.map((n,i)=>[n.id,(r>>(switches.length-1-i))&1]));
   const evalNode=evaluateCircuit(states),tr=document.createElement('tr');
   if(switches.every(n=>states.get(n.id)===(n.value?1:0)))tr.className='current';
   for(const [i,n] of [...switches,...lamps].entries()){
    const td=document.createElement('td'),v=n.type==='switch'?states.get(n.id):evalNode(n.id);
    if(i===switches.length)td.classList.add('first-out');
    if(v===1){const one=document.createElement('span');one.className='bit-one';one.textContent='1';td.appendChild(one);}
    else{td.textContent=v===null?'–':'0';if(v===null)td.classList.add('unknown');}
    tr.appendChild(td);
   }tbody.appendChild(tr);
  }table.appendChild(tbody);
 }
 const formulas=$('truthFormulas');formulas.replaceChildren();
 for(const n of lamps){const formula=document.createElement('div');formula.className='truth-formula';const label=document.createElement('strong');label.textContent=n.name+' = ';formula.appendChild(label);formula.append(document.createTextNode(lampExpression(n)));formulas.appendChild(formula);}
 const stats=$('truthStats');stats.replaceChildren();
 for(const [v,label] of [[nodes.filter(n=>['and','or','not','xor'].includes(n.type)).length,'Kapı'],[edges.length,'Kablo'],[switches.length>6?'—':rows,'Satır']]){
  const box=document.createElement('div'),count=document.createElement('b'),symbol=document.createElement('span');box.className='truth-stat';box.title=label;box.setAttribute('aria-label',`${v} ${label}`);count.textContent=v;symbol.className='stat-symbol';symbol.setAttribute('aria-hidden','true');
  const svg=svgEl('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'});
  const paths={Kapı:['M3 5h6c6 0 10 3 10 7s-4 7-10 7H3Z','M1 9h3M1 15h3M19 12h4'],Kablo:['M4 5a2 2 0 1 0 0 4a2 2 0 0 0 0-4','M20 15a2 2 0 1 0 0 4a2 2 0 0 0 0-4','M6 7c13-1 0 10 12 10'],Satır:['M4 5h16v14H4z','M4 10h16M4 15h16M10 5v14']};
  for(const d of paths[label])svg.appendChild(svgEl('path',{d}));symbol.appendChild(svg);box.append(count,symbol);stats.appendChild(box);
 }
}
function renderInspector(){
 const panel=$('inspector'),n=selection?.kind==='node'?getNode(selection.id):null,wire=selection?.kind==='wire'?edges.find(e=>e.id===selection.id):null;
 if(!n&&!wire){panel.hidden=true;return;}
 panel.hidden=false;
 $('inspectorType').textContent=n?(n.type==='lamp'?(n.emoji||'💡'):n.type==='switch'?'⚡':'◇'):'〰';
 $('inspectorName').textContent=n?n.name:'Kablo';
 const state=$('inspectorState'),value=n?(n.type==='lamp'?computed[n.id]?.lit:outputValue(n.id)):null;
 state.hidden=!(n&&(n.type==='lamp'||n.type==='switch'));state.textContent=value==null?'?':String(value);state.className='inspector-state '+valueClass(value);
 const body=$('inspectorBody');body.replaceChildren();
 if(n?.type==='lamp'){
  const label=document.createElement('div');label.className='inspector-emoji-label';label.textContent='Lamba yüzü';body.appendChild(label);
  const grid=document.createElement('div');grid.className='emoji-grid';grid.setAttribute('role','group');grid.setAttribute('aria-label','Lamba için hayvan emojisi seç');
  for(const emoji of ['',...ANIMAL_EMOJIS]){
   const option=document.createElement('button');option.type='button';option.className='emoji-option';option.textContent=emoji||'💡';option.title=emoji||'Normal lamba';option.setAttribute('aria-label',emoji?'Hayvan simgesi '+emoji:'Normal lamba');option.setAttribute('aria-pressed',String((n.emoji||'')===emoji));
   option.addEventListener('click',()=>{if((n.emoji||'')===emoji)return;remember();n.emoji=emoji;persist();refresh();});grid.appendChild(option);
  }body.appendChild(grid);
 }
}
function refresh(){compute();nodesEl.replaceChildren(...nodes.map(decorateNode));renderWires();renderInspector();renderTruth();updateHistoryButtons();}
function fit(){if(!nodes.length){zoom=1;panX=48;panY=35;setView();return;}const margin=80;const x1=Math.min(...nodes.map(n=>n.x)),x2=Math.max(...nodes.map(n=>n.x+NW)),y1=Math.min(...nodes.map(n=>n.y)),y2=Math.max(...nodes.map(n=>n.y+NH));const r=viewport.getBoundingClientRect();zoom=clamp(Math.min((r.width-margin)/(x2-x1),(r.height-margin)/(y2-y1),1.45),.35,1.7);panX=(r.width-(x2-x1)*zoom)/2-x1*zoom;panY=(r.height-(y2-y1)*zoom)/2-y1*zoom;setView();}
function changeZoom(factor){const r=viewport.getBoundingClientRect();const cx=r.width/2,cy=r.height/2,worldX=(cx-panX)/zoom,worldY=(cy-panY)/zoom;zoom=clamp(zoom*factor,.35,2);panX=cx-worldX*zoom;panY=cy-worldY*zoom;setView();}
function demo(){if(nodes.length&&!confirm('Örnek devre mevcut çalışmanın yerine kurulsun mu?'))return;remember();nodes=[{id:1,type:'switch',x:150,y:220,name:'A',value:0},{id:2,type:'switch',x:150,y:400,name:'B',value:0},{id:3,type:'xor',x:495,y:212,name:'XOR',value:0},{id:4,type:'and',x:495,y:394,name:'AND',value:0},{id:5,type:'lamp',x:840,y:212,name:'Toplam',value:0},{id:6,type:'lamp',x:840,y:394,name:'Elde',value:0}];edges=[{id:7,from:1,to:3,port:0},{id:8,from:2,to:3,port:1},{id:9,from:1,to:4,port:0},{id:10,from:2,to:4,port:1},{id:11,from:3,to:5,port:0},{id:12,from:4,to:6,port:0}];nextId=13;pending=null;selection=null;refresh();fit();persist();notify('Yarım toplayıcı kuruldu. A ve B anahtarlarına dokun.');}
// Tool palette: drag on desktop/tablet; tapping puts the part near the center.
for(const t of document.querySelectorAll('.tool')){t.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();const type=t.dataset.type;const start={x:e.clientX,y:e.clientY};let moved=false;const ghost=document.createElement('div');ghost.className='floating-ghost';ghost.textContent=TYPE_NAMES[type];ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.body.appendChild(ghost);t.setPointerCapture(e.pointerId);
 const move=ev=>{if(ev.pointerId!==e.pointerId)return;if(Math.hypot(ev.clientX-start.x,ev.clientY-start.y)>6)moved=true;ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';};
 const end=ev=>{if(ev.pointerId!==e.pointerId)return;t.removeEventListener('pointermove',move);t.removeEventListener('pointerup',end);t.removeEventListener('pointercancel',end);ghost.remove();if(ev.type==='pointercancel')return;const r=viewport.getBoundingClientRect();if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){const p=point(ev);addNode(type,p.x-NW/2,p.y-NH/2);}else if(!moved){centerAdd(type);}else notify('Parçayı çalışma alanına bırak.');};
 t.addEventListener('pointermove',move);t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
 });}
// Blank-space pointer dragging pans the board. Two-finger pinch zooms the canvas.
const touches=new Map();
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.wire-hit,.port'))return;if(e.button!==0)return;viewport.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const pts=[...touches.values()];pinch={dist:Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y),zoom,panX,panY,mid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2}};interaction=null;}else{interaction={id:e.pointerId,x:e.clientX,y:e.clientY,panX,panY,moved:false};}if(pending){pending=null;renderPorts();}});
viewport.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2&&pinch){const pts=[...touches.values()];const dist=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);const r=viewport.getBoundingClientRect(),midX=(pts[0].x+pts[1].x)/2-r.left,midY=(pts[0].y+pts[1].y)/2-r.top,originalX=pinch.mid.x-r.left,originalY=pinch.mid.y-r.top;zoom=clamp(pinch.zoom*dist/(pinch.dist||1),.35,2);panX=midX-(originalX-pinch.panX)/pinch.zoom*zoom;panY=midY-(originalY-pinch.panY)/pinch.zoom*zoom;setView();return;}if(interaction?.id!==e.pointerId)return;const dx=e.clientX-interaction.x,dy=e.clientY-interaction.y;if(Math.hypot(dx,dy)>4)interaction.moved=true;if(interaction.moved){viewport.classList.add('panning');panX=interaction.panX+dx;panY=interaction.panY+dy;setView();}});
const endPan=e=>{touches.delete(e.pointerId);if(touches.size<2)pinch=null;if(interaction?.id===e.pointerId){if(!interaction.moved){selection=null;refresh();}interaction=null;}viewport.classList.remove('panning');};
viewport.addEventListener('pointerup',endPan);viewport.addEventListener('pointercancel',endPan);
viewport.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();const r=viewport.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,worldX=(cx-panX)/zoom,worldY=(cy-panY)/zoom;zoom=clamp(zoom*Math.exp(-e.deltaY*.003),.35,2);panX=cx-worldX*zoom;panY=cy-worldY*zoom;setView();}else if(Math.abs(e.deltaX)+Math.abs(e.deltaY)>0){e.preventDefault();panX-=e.deltaX;panY-=e.deltaY;setView();}},{passive:false});
for(const id of ['inspector','zoomOut','zoomIn','fitBtn'])$(id).addEventListener('pointerdown',e=>e.stopPropagation());
$('inspectorClose').addEventListener('click',()=>{selection=null;refresh();});
$('truthToggle').addEventListener('click',()=>{const layout=document.querySelector('.workspace-layout');const open=layout.classList.toggle('table-open');$('truthToggle').setAttribute('aria-expanded',String(open));$('truthContent').hidden=!open;});$('demoBtn').addEventListener('click',demo);$('deleteBtn').addEventListener('click',deleteSelected);$('newBtn').addEventListener('click',clearBoard);$('undoBtn').addEventListener('click',undo);$('redoBtn').addEventListener('click',redo);$('zoomIn').addEventListener('click',()=>changeZoom(1.18));$('zoomOut').addEventListener('click',()=>changeZoom(1/1.18));$('fitBtn').addEventListener('click',fit);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){pending=null;selection=null;refresh();}if(['Delete','Backspace'].includes(e.key)&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(selection)deleteSelected();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}});
window.addEventListener('resize',()=>{if(!nodes.length){setView();}});
// Recover progress locally if available. The file needs no server and no dependencies.
let saved=null;try{saved=localStorage.getItem(STORAGE_KEY);}catch(e){}
if(saved)restore(saved);else refresh();setView();if(window.innerWidth>=1100){$('truthToggle').click();}
})();
</script>
